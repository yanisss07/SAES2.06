<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villes · Quai des Arts</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="./styles/intro.css">
    <style>
        .villes-hero {
            max-width: 700px;
            margin: 0 auto;
            padding: 100px 24px 40px;
            text-align: center;
        }

        .villes-hero h2 {
            margin: 0 0 18px;
            font-size: clamp(1.6rem, 3.5vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-text);
        }

        .villes-hero p {
            margin: 0;
            color: var(--color-muted);
            font-size: 0.97rem;
            line-height: 1.7;
        }

        /* ── City cards strip ── */
        .city-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-width: 1100px;
            margin: 32px auto 0;
            padding: 0 24px;
        }

        .city-card {
            position: relative;
            width: 140px;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.25s ease, transform 0.2s ease;
            flex-shrink: 0;
        }

        .city-card:hover { transform: translateY(-3px); }

        .city-card.is-active {
            border-color: var(--color-accent-a);
            filter: hue-rotate(var(--hue-rot, 0deg));
        }

        .city-card__thumb {
            width: 100%;
            aspect-ratio: 3/2;
            object-fit: cover;
            display: block;
        }

        .city-card__label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 8px 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #fff;
            text-align: center;
        }

        /* ── Inline viewer (grid expand trick) ── */
        .viewer-wrap {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.45s ease;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .viewer-wrap.is-open {
            grid-template-rows: 1fr;
        }

        .city-viewer {
            overflow: hidden;
        }

        .city-viewer__inner {
            padding: 24px 0 8px;
        }

        .city-viewer__header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .city-viewer__name {
            margin: 0 0 4px;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .city-viewer__country {
            font-size: 0.8rem;
            color: var(--color-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .viewer-close {
            background: none;
            border: 1px solid var(--color-panel-border);
            border-radius: 999px;
            padding: 5px 14px;
            color: var(--color-muted);
            font-size: 0.8rem;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }

        .viewer-close:hover { color: var(--color-text); border-color: var(--color-text); }

        /* Image display */
        .viewer-image-wrap {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--color-panel-border);
        }

        .viewer-img {
            width: 100%;
            max-height: 480px;
            object-fit: cover;
            display: block;
            transition: opacity 0.35s ease;
        }

        .viewer-img.is-fading { opacity: 0; }

        .viewer-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }

        .viewer-arrow:hover { background: rgba(0,0,0,0.85); }
        .viewer-arrow--prev { left: 12px; }
        .viewer-arrow--next { right: 12px; }

        .viewer-dots {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin: 14px 0;
        }

        .viewer-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .viewer-dot.is-active { background: var(--color-accent-a); transform: scale(1.35); filter: hue-rotate(var(--hue-rot, 0deg)); }

        body.light-mode .viewer-dot { background: rgba(0,0,0,0.18); }

        .viewer-desc {
            color: var(--color-muted);
            font-size: 0.95rem;
            line-height: 1.7;
            margin: 4px 0 0;
        }

        .villes-spacer { height: 80px; }

        @media (max-width: 600px) {
            .city-card { width: 120px; }
        }
    </style>
</head>
<body>
    <div class="bg-slide" id="bg-a"></div>
    <div class="bg-slide bg-slide--hidden" id="bg-b"></div>
    <div class="bg-overlay"></div>

    <div id="theme-toggle" class="theme-bubble" role="button" aria-label="Basculer le thème">
        <span class="tb-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
        <div class="tb-track"><div class="tb-knob"></div></div>
        <span class="tb-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/></svg></span>
    </div>

    <nav class="intro-nav">
        <a href="./index.html" class="btn-back">← Retour</a>
    </nav>

    <div class="page-content">
        <div class="villes-hero anim-in">
            <h2>L'art dans le métro</h2>
            <p>Dans certaines villes, l'art dans le métro ne se cache pas. Il s'impose. Les voyageurs le voient, le photographient, en parlent. Découvrez ces métros qui ont fait de leurs stations de véritables musées.</p>
        </div>

        <div class="city-strip" id="city-strip"></div>

        <div class="viewer-wrap" id="viewer-wrap">
            <div class="city-viewer">
                <div class="city-viewer__inner">
                    <div class="city-viewer__header">
                        <div>
                            <h3 class="city-viewer__name" id="viewer-name"></h3>
                            <span class="city-viewer__country" id="viewer-country"></span>
                        </div>
                        <button class="viewer-close" id="viewer-close">Fermer ✕</button>
                    </div>
                    <div class="viewer-image-wrap">
                        <button class="viewer-arrow viewer-arrow--prev" id="viewer-prev">‹</button>
                        <img class="viewer-img" id="viewer-img" src="" alt="">
                        <button class="viewer-arrow viewer-arrow--next" id="viewer-next">›</button>
                    </div>
                    <div class="viewer-dots" id="viewer-dots"></div>
                    <p class="viewer-desc" id="viewer-desc"></p>
                </div>
            </div>
        </div>

        <div class="villes-spacer"></div>
    </div>

    <a href="./toulouse.html" class="btn-primary btn-fixed-br">Continuer →</a>

    <script>
        // ── Theme ──
        var mq = window.matchMedia("(prefers-color-scheme: light)");
        var saved = localStorage.getItem("theme");
        var isLight = saved ? saved === "light" : mq.matches;
        if (isLight) document.body.classList.add("light-mode");
        var toggle = document.getElementById("theme-toggle");
        function applyTheme(light, save) {
            isLight = light;
            document.body.classList.toggle("light-mode", light);
            if (save !== false) localStorage.setItem("theme", light ? "light" : "dark");
        }
        toggle.addEventListener("click", function() { applyTheme(!isLight); });
        mq.addEventListener("change", function(e) { if (!localStorage.getItem("theme")) applyTheme(e.matches, false); });

        // ── Random hue for button + active card border ──
        var hueRot = Math.floor(Math.random() * 360);
        document.documentElement.style.setProperty("--btn-hue-offset", "-" + (hueRot / 18).toFixed(1) + "s");
        document.documentElement.style.setProperty("--hue-rot", hueRot + "deg");

        // ── City data ──
        var CITIES = [
            { id:'lisbon',    name:'Lisbonne',  country:'Portugal',    desc:'Capitale du Portugal, connue pour ses tramways, ses azulejos et son architecture historique au bord de l\'Atlantique.', images:['01','02','03','04','05'], ext:'webp' },
            { id:'montreal',  name:'Montréal',  country:'Canada',      desc:'Grande ville du Québec, connue pour sa culture francophone, ses festivals et son architecture mêlant ancien et moderne.', images:['01','02','03','04','05'], ext:'webp' },
            { id:'moscow',    name:'Moscou',    country:'Russie',      desc:'Capitale de la Russie, connue pour le Kremlin, la Place Rouge et son architecture soviétique imposante.', images:['01','02','03','04','05'], ext:'webp' },
            { id:'naples',    name:'Naples',    country:'Italie',      desc:'Ville du sud de l\'Italie, connue pour la pizza, le Vésuve et son riche patrimoine gréco-romain.', images:['01','02','03','04','05'], ext:'webp' },
            { id:'new york',  name:'New York',  country:'États-Unis',  desc:'Plus grande ville des États-Unis, connue pour ses gratte-ciels, Broadway et son influence culturelle mondiale.', images:['01','02','03','04','05'], ext:'webp' },
            { id:'shanghai',  name:'Shanghai',  country:'Chine',       desc:'Plus grande ville de Chine, connue pour son skyline futuriste et son mélange entre modernité et culture traditionnelle.', images:['01','02','03','04','05'], ext:'webp' },
            { id:'stockholm', name:'Stockholm', country:'Suède',       desc:'Capitale de la Suède, connue pour son design scandinave, ses îles et sa qualité de vie élevée.', images:['1','2','3','4','5'], ext:'webp' }
        ];

        // ── Perlin noise (compact) ──
        var perlin = (function(){
            var p=[];
            for(var i=0;i<256;i++) p[i]=i;
            for(var i=255;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=p[i];p[i]=p[j];p[j]=t; }
            for(var i=0;i<256;i++) p[i+256]=p[i];
            function fade(t){return t*t*t*(t*(t*6-15)+10);}
            function lerp(a,b,t){return a+t*(b-a);}
            function grad(h,x,y,z){h&=15;var u=h<8?x:y,v=h<4?y:(h==12||h==14?x:z);return((h&1)?-u:u)+((h&2)?-v:v);}
            return {noise:function(x,y,z){
                var X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;
                x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);
                var u=fade(x),v=fade(y),w=fade(z);
                var A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z,B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
                return lerp(lerp(lerp(grad(p[AA],x,y,z),grad(p[BA],x-1,y,z),u),lerp(grad(p[AB],x,y-1,z),grad(p[BB],x-1,y-1,z),u),v),lerp(lerp(grad(p[AA+1],x,y,z-1),grad(p[BA+1],x-1,y,z-1),u),lerp(grad(p[AB+1],x,y-1,z-1),grad(p[BB+1],x-1,y-1,z-1),u),v),w);
            }};
        })();

        // ── Noise canvas on a card element ──
        var PIXEL_SIZE=12, OPACITY=0.28, SPEED=1.4, RANDOMNESS=0.35, TRANS_DUR=0.35, LEAVE_DUR=0.45;

        function attachNoise(card) {
            var canvas = document.createElement("canvas");
            canvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;mix-blend-mode:luminosity;image-rendering:pixelated;";
            ctx = canvas.getContext("2d");
            ctx.imageSmoothingEnabled = false;
            card.appendChild(canvas);

            var isHovered=false, hoverStart=null, leaveStart=null, frozenHoverAge=0, frozenReveal=0;
            var iA=1, hA=0, hAge=0, reveal=0;
            var rafId=null, startTime=Date.now();

            function resize() {
                var dpr=devicePixelRatio||1;
                var r=card.getBoundingClientRect();
                canvas.width=Math.ceil(r.width*dpr);
                canvas.height=Math.ceil(r.height*dpr);
            }
            resize();

            card.addEventListener("mouseenter",function(){
                isHovered=true; hoverStart=Date.now(); leaveStart=null;
            });
            card.addEventListener("mouseleave",function(){
                isHovered=false; leaveStart=Date.now();
                frozenHoverAge=hAge; frozenReveal=reveal;
            });

            function draw() {
                var now=Date.now();
                var t=(now-startTime)*0.001;
                var dpr=devicePixelRatio||1;
                var ps=PIXEL_SIZE*dpr;
                var cols=Math.ceil(canvas.width/ps)+1;
                var rows=Math.ceil(canvas.height/ps)+1;

                if(isHovered) {
                    var el=(now-hoverStart)*0.001;
                    var pr=Math.min(el/TRANS_DUR,1);
                    iA=1-pr; hA=pr; hAge=el;
                    reveal=1-Math.pow(1-Math.min(0.5*el,1),3);
                } else if(leaveStart!==null) {
                    var lp=Math.min((now-leaveStart)*0.001/LEAVE_DUR,1);
                    iA=lp; hA=1-lp; hAge=frozenHoverAge; reveal=frozenReveal;
                    if(lp>=1) leaveStart=null;
                } else {
                    iA=1; hA=0;
                }

                ctx.clearRect(0,0,canvas.width,canvas.height);

                // Idle: wave-noisy
                if(iA>0.01) {
                    for(var e=0;e<cols;e++) {
                        for(var a=0;a<rows;a++) {
                            var phase=(e+a)/(cols+rows)*Math.PI*5-t*1.1;
                            var base=(Math.sin(phase)+1)*0.5;
                            var rnd=43758.5453*Math.sin(12.9898*e+78.233*a);
                            rnd=rnd-Math.floor(rnd);
                            var v=base*0.7+rnd*0.3; v=v*v;
                            var j=Math.floor(255*(0.3+v*0.7));
                            ctx.fillStyle="rgba("+j+","+j+","+j+","+(OPACITY*0.85*iA)+")";
                            ctx.fillRect(e*ps,a*ps,ps,ps);
                        }
                    }
                }

                // Hover: Perlin reveal
                if(hA>0.01) {
                    for(var e=0;e<cols;e++) {
                        for(var a=0;a<rows;a++) {
                            var l=perlin.noise(0.2*e,0.2*a,0.5*hAge*SPEED);
                            var s=43758.5453*Math.sin(12.9898*e+78.233*a);
                            s=s-Math.floor(s);
                            var d=(l+(s*2-1)*RANDOMNESS+1)*0.75;
                            var bx=(e+.5)/cols,by=(a+.5)/rows;
                            var ar=cols/rows;
                            var fx=(bx-0.5)*ar,fy=by-0.5;
                            var dist=Math.sqrt(fx*fx+fy*fy)/ar+(s-0.5)*RANDOMNESS*0.35;
                            var pA=0;
                            if(dist<=reveal) pA=OPACITY;
                            else if(dist<=reveal+0.08) pA=OPACITY*(1-(dist-reveal)/0.08);
                            if(pA<0.001) continue;
                            var jj=Math.floor(255*d);
                            ctx.fillStyle="rgba("+jj+","+jj+","+jj+","+(pA*hA)+")";
                            ctx.fillRect(e*ps,a*ps,ps,ps);
                        }
                    }
                }

                rafId=requestAnimationFrame(draw);
            }
            draw();
        }

        // ── Build city strip ──
        var strip = document.getElementById("city-strip");
        CITIES.forEach(function(city, i) {
            var card = document.createElement("div");
            card.className = "city-card anim-in";
            card.style.animationDelay = (0.05*i+0.1)+"s";
            var img = document.createElement("img");
            img.className = "city-card__thumb";
            img.src = "./villes/"+encodeURIComponent(city.id)+"/"+city.images[0]+"."+city.ext;
            img.alt = city.name;
            img.loading = "lazy";
            var label = document.createElement("div");
            label.className = "city-card__label";
            label.textContent = city.name;
            card.appendChild(img);
            card.appendChild(label);
            card.addEventListener("click", function() { openCity(city, card); });
            strip.appendChild(card);
            attachNoise(card);
        });

        // ── Viewer logic ──
        var viewerWrap = document.getElementById("viewer-wrap");
        var viewerName = document.getElementById("viewer-name");
        var viewerCountry = document.getElementById("viewer-country");
        var viewerImg = document.getElementById("viewer-img");
        var viewerDots = document.getElementById("viewer-dots");
        var viewerDesc = document.getElementById("viewer-desc");
        var activeCard = null;
        var currentCity = null;
        var currentImg = 0;

        function openCity(city, card) {
            if (activeCard === card) {
                closeViewer(); return;
            }
            if (activeCard) activeCard.classList.remove("is-active");
            activeCard = card;
            card.classList.add("is-active");
            currentCity = city;
            currentImg = 0;

            viewerName.textContent = city.name;
            viewerCountry.textContent = city.country;
            viewerDesc.textContent = city.desc;

            buildDots(city.images.length);
            setViewerImg(0);

            viewerWrap.classList.add("is-open");
            setTimeout(function() {
                viewerWrap.scrollIntoView({ behavior:"smooth", block:"nearest" });
            }, 50);
        }

        function closeViewer() {
            viewerWrap.classList.remove("is-open");
            if (activeCard) { activeCard.classList.remove("is-active"); activeCard = null; }
        }

        function buildDots(count) {
            viewerDots.innerHTML = "";
            for (var i = 0; i < count; i++) {
                var dot = document.createElement("div");
                dot.className = "viewer-dot" + (i===0?" is-active":"");
                dot.dataset.i = i;
                dot.addEventListener("click", function() { setViewerImg(+this.dataset.i); });
                viewerDots.appendChild(dot);
            }
        }

        function setViewerImg(idx) {
            currentImg = (idx + currentCity.images.length) % currentCity.images.length;
            var src = "./villes/"+encodeURIComponent(currentCity.id)+"/"+currentCity.images[currentImg]+"."+currentCity.ext;
            viewerImg.classList.add("is-fading");
            setTimeout(function() {
                viewerImg.src = src;
                viewerImg.alt = currentCity.name + " " + (currentImg+1);
                viewerImg.classList.remove("is-fading");
            }, 180);
            viewerDots.querySelectorAll(".viewer-dot").forEach(function(d,i) {
                d.classList.toggle("is-active", i===currentImg);
            });
        }

        document.getElementById("viewer-close").addEventListener("click", closeViewer);
        document.getElementById("viewer-prev").addEventListener("click", function() { setViewerImg(currentImg-1); });
        document.getElementById("viewer-next").addEventListener("click", function() { setViewerImg(currentImg+1); });

        document.addEventListener("keydown", function(e) {
            if (!viewerWrap.classList.contains("is-open")) return;
            if (e.key==="Escape") closeViewer();
            if (e.key==="ArrowLeft") setViewerImg(currentImg-1);
            if (e.key==="ArrowRight") setViewerImg(currentImg+1);
        });
        initBgCycle();
    </script>
</body>
</html>
