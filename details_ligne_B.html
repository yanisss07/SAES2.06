<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail de l'Œuvre - Ligne B</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: #202124; color: #e8eaed;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column;
            }


        /* ── Floating header ── */
        header {
            position: fixed;
            top: 16px; left: 16px; right: 16px;
            padding: 0 20px;
            height: 58px;
            display: flex; justify-content: space-between; align-items: center;
            background-color: #ffcb04;
            border: none;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.8);
            border-radius: 14px;
            overflow: hidden;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 10px; }

        .back-btn {
            text-decoration: none; color: rgba(0,0,0,0.7);
            display: flex; align-items: center;
            padding: 6px; border-radius: 8px;
            transition: color 0.2s;
        }
        .back-btn:hover { color: #000; }
        .back-btn svg { fill: currentColor; display: block; }

        .header-logo {
            height: 84px;
            width: 84px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .station-selector {
            background: transparent; color: #000;
            border: none; outline: none;
            font-family: 'Roboto', sans-serif;
            font-size: 15px; font-weight: 700;
            cursor: pointer;
        }
        .station-selector option { background: #303134; color: #fff; }

        .header-right {
            font-weight: 900; letter-spacing: 1px;
            font-size: 13px; color: rgba(0,0,0,0.7);
        }
        @media (min-width: 769px) {
            .header-right { margin-right: 100px; }
        }

        /* ── Main layout ── */
        main {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: calc(16px + 58px + 24px) 20px 20px;
            animation: fadeIn 0.7s ease-out;
        }

        /* ── Cards ── */
        .section-card {
            background: rgba(0, 0, 0, 0.32);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        /* ── Light mode ── */
        body.light-mode .section-card {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 24px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.8);
        }
        body.light-mode .section-label  { color: rgba(0,0,0,0.5); }
        body.light-mode .artwork-title  { color: #111; }
        body.light-mode .artist-name    { color: #1a56c4; }
        body.light-mode .artist-meta    { color: rgba(0,0,0,0.5); }
        body.light-mode p               { color: #222; }
        body.light-mode .placeholder    { color: #999; background: rgba(0,0,0,0.05); }

        /* ── Liquid glass slider ── */
        .mode-slider {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 2px 12px rgba(0,0,0,0.25);
            cursor: pointer;
            user-select: none;
            position: fixed;
            top: 29px;
            right: 30px;
            z-index: 1001;
        }
        @media (max-width: 768px) {
            .mode-slider {
                top: auto;
                right: auto;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
            }
        }
        .mode-slider { color: rgba(0,0,0,0.8); }
        .slider-icon { display: flex; align-items: center; opacity: 0.8; }
        .slider-track {
            position: relative;
            width: 36px;
            height: 20px;
            border-radius: 50px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }
        body.light-mode .slider-track {
            background: rgba(255,255,255,0.35);
        }
        .slider-knob {
            position: absolute;
            top: 2px; left: 2px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 1px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,1);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        body.light-mode .slider-knob {
            transform: translateX(16px);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: stretch;
        }

        /* ── Media frames ── */
        .media-frame {
            border-radius: 12px;
            overflow: hidden;
            background: #111;
            border: 1px solid #3c4043;
            position: relative;
        }
        .media-frame img,
        .media-frame video { width: 100%; height: 100%; object-fit: cover; display: block; }

        .full-frame img,
        .full-frame video { height: auto; object-fit: unset; }

        .side-frame { min-height: 200px; height: 100%; }

        .placeholder {
            width: 100%; height: 100%; min-height: 200px;
            display: flex; align-items: center; justify-content: center;
            color: #5f6368; font-weight: 700; letter-spacing: 2px; font-size: 11px;
            background: radial-gradient(circle at 70% 30%, #333, #202124);
        }

        /* ── Text styles ── */
        .section-label {
            font-size: 11px; font-weight: 500; color: #9aa0a6;
            text-transform: uppercase; letter-spacing: 2px;
            margin: 0 0 14px 0;
        }

        .line-badge {
            display: inline-block;
            padding: 4px 12px; border-radius: 50px;
            font-weight: 900; font-size: 12px; text-transform: uppercase;
            background-color: #FFCD00; color: #000;
            box-shadow: 0 0 12px rgba(255, 205, 0, 0.4);
            margin-bottom: 10px;
        }

        .artwork-title { font-size: 24px; font-weight: 700; color: #fff; margin: 0 0 10px 0; }
        .artist-name   { font-size: 22px; font-weight: 500; color: #8ab4f8; margin: 0 0 4px 0; }
        .artist-meta   { font-style: italic; color: #9aa0a6; font-size: 13px; margin: 0 0 14px 0; display: block; }

        p { line-height: 1.8; color: #bdc1c6; font-size: 15px; margin: 0 0 10px 0; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

        /* ── Progressive image loading ── */
        #bg-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform-origin: center;
            transition: filter 0.8s ease, transform 0.8s ease;
        }
        #bg-layer.bg-loading { filter: blur(40px); transform: scale(1.08); }
        #mainImage { transition: filter 0.6s ease, transform 0.6s ease; }
        #mainImage.img-loading { filter: blur(20px); transform: scale(1.05); }
        .media-frame.frame-loading::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d2232a 40%, #ff6b6b 50%, #d2232a 60%, transparent);
            background-size: 200% 100%;
            animation: shimmer-bar 1.2s linear infinite;
            z-index: 10;
        }
        @keyframes shimmer-bar {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 700px) {
            .grid-2 { grid-template-columns: 1fr; }
            header { top: 8px; left: 8px; right: 8px; }
            main { padding-top: 90px; }
        }

        footer {
            text-align: center; padding: 20px 40px;
            color: rgba(255,255,255,0.75); font-size: 12px;
            margin: 0 20px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
<div id="bg-layer"></div>

<header>
    <div class="header-left">
        <a href="index.html" class="back-btn" id="backButtonB">
            <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20">
                <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z"/>
            </svg>
        </a>
        <img id="headerLogo" class="header-logo" src="" alt="">
        <select id="stationSelect" class="station-selector" onchange="loadStation(this.value)"></select>
    </div>
    <div style="display:flex;align-items:center;">
        <span class="header-right">LIGNE B</span>
    </div>
</header>

<div class="mode-slider" id="modeSlider" onclick="toggleMode()">
    <span class="slider-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
    <div class="slider-track"><div class="slider-knob"></div></div>
    <span class="slider-icon"><svg width="13" height="13" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/></svg></span>
</div>

<main id="mainContent">

    <!-- Card 1 : Œuvre -->
    <div class="section-card neon-border-top">
        <div class="grid-2">
            <div class="media-frame main-frame">
                <img id="mainImage" src="" alt="œuvre principale">
            </div>
            <div>
                <p class="section-label">L'Œuvre</p>
                <span id="positionBadge" class="line-badge">MÉTRO</span>
                <div class="artwork-title" id="titreOeuvre"></div>
                <div id="descOeuvre"></div>
            </div>
        </div>
    </div>

    <!-- Card 2 : Artiste + 1er média extra -->
    <div class="section-card">
        <p class="section-label">L'Artiste</p>
        <div id="artisteInner" class="grid-2">
            <div>
                <div class="artist-name" id="nomArtiste"></div>
                <span class="artist-meta" id="metaArtiste"></span>
                <div id="bioArtiste"></div>
            </div>
            <div id="firstMediaWrapper" class="media-frame side-frame" style="display:none;">
                <div id="firstMedia" style="width:100%;height:100%;"></div>
            </div>
        </div>
    </div>

    <!-- Médias extra 2, 3 … n -->
    <div id="extraMedia"></div>

</main>

<footer>
    Tisséo Collectivités — Parcours Culturel | Données extraites du dépliant officiel
</footer>

<script>
const stationsLigneB = {
    "borderouge": {
        name: "Borderouge", badge: "TERMINUS NORD",
        artist: "Alain Josseau", meta: "Nantes (Loire-Atlantique), 1968",
        title: "Espace-Temps",
        desc: "<p>L'œuvre se compose de deux parties. À l'intérieur, la représentation graphique et tridimensionnelle du son lorsque sont prononcés « ici » et « là » élabore une forme lumineuse. À l'extérieur, un pipe-line signale l'accès au métro, parcouru par un faisceau lumineux rythmé par la suite de Fibonacci.</p>",
        bio: "<p>Alain Josseau travaille sur l'image et sa perception, mêlant souvent des technologies de surveillance ou de mesure à une esthétique visuelle forte.</p>"
    },
    "trois_cocus": {
        name: "Trois Cocus", badge: "STATION",
        artist: "Pierrick Sorin", meta: "Nantes (Loire-Atlantique), 1960",
        title: "Sans titre (Portraits)",
        desc: "<p>Ce tableau animé est une œuvre interactive dans laquelle le voyageur est aussi acteur. Les usagers sont invités à présenter leur visage aux bornes. Une fois numérisés, ces portraits viennent se mêler à l'animation ludique qui défile sur les écrans.</p>",
        bio: "<p>Pierrick Sorin est un vidéaste connu pour ses « auto-filmages » burlesques et ses dispositifs optiques holographiques, les « théâtres optiques ».</p>"
    },
    "la_vache": {
        name: "La Vache", badge: "STATION",
        artist: "Corinne Sentou", meta: "Toulouse (Haute-Garonne), 1964",
        title: "Sans titre",
        desc: "<p>Cette œuvre rétroéclairée forme un miroir arrondi scintillant de lumière colorée. La notion de mur s'efface au profit d'une vision panoramique miroitante qui invite les usagers à vivre leur relation à l'espace comme un instant de lumière magique.</p>",
        bio: "<p>Corinne Sentou travaille sur la perception de l'espace par des installations minimales et colorées qui jouent avec l'architecture.</p>"
    },
    "barriere_de_paris": {
        name: "Barrière de Paris", badge: "STATION",
        artist: "Bernar Venet", meta: "Saint-Auban (Alpes Maritimes), 1941",
        title: "Arcs majeurs",
        desc: "<p>La sculpture se compose de deux arcs verticaux de 25 mètres de hauteur en acier Corten, se croisant dans leur partie supérieure. L'œuvre constitue un repère visuel monumental à l'entrée nord de la ville, mêlant rationalité mathématique et recherche artistique.</p>",
        bio: "<p>Artiste conceptuel majeur, Bernar Venet est mondialement connu pour ses sculptures monumentales en acier aux lignes indéterminées.</p>"
    },
    "minimes": {
        name: "Minimes - Cl. Nougaro", badge: "STATION",
        artist: "Olivier Mosset & Damien Aspe", meta: "Suisse (1944) & Toulouse (1973)",
        title: "Monochrome et Inversion",
        desc: "<p>Un mur est investi d'un monochrome orange, en relation avec les briques de la ville, tandis que le plafond est peint en bleu. Au niveau inférieur, les couleurs sont inversées. Cette œuvre s'inscrit dans la recherche d'une expression minimale.</p>",
        bio: "<p>Une collaboration entre un maître du minimalisme radical (Mosset) et un artiste questionnant les technologies et le son (Aspe).</p>"
    },
    "canal_du_midi": {
        name: "Canal du Midi", badge: "STATION",
        artist: "Daniel Pommereulle", meta: "Sceaux (1937-2003)",
        title: "Le Bronze et l'Eau",
        desc: "<p>Cette œuvre est constituée de quatre sculptures monumentales composées de matériaux nobles tels que le verre, le cuivre, la porcelaine, l'ardoise et le bronze. Elle marque l'opposition, parfois brutale, des matériaux.</p>",
        bio: "<p>Peintre, sculpteur et cinéaste, Pommereulle a traversé le mouvement surréaliste en gardant une fascination pour les objets tranchants et la transparence.</p>"
    },
    "compans_caffarelli": {
        name: "Compans Caffarelli", badge: "JARDIN JAPONAIS",
        artist: "Ange Leccia", meta: "Minervio (Corse), 1952",
        title: "Sans titre",
        desc: "<p>La station est investie par deux imposants panneaux de lumière artificielle dynamique en fibres optiques tissées. Les couleurs changeantes rappellent la lumière naturelle des couchers et levers de soleil, contrastant avec l'univers souterrain.</p>",
        bio: "<p>Ange Leccia travaille l'image en mouvement et la lumière pour créer des arrangements visuels hypnotiques et contemplatifs.</p>"
    },
    "jeanne_d_arc": {
        name: "Jeanne d'Arc", badge: "CENTRE VILLE",
        artist: "Sophie Calle", meta: "Paris, 1953",
        title: "Transport Amoureux",
        desc: "<p>Sophie Calle a installé des écrans diffusant des messages laissés par les voyageurs. Chacun peut ainsi engager un lien ou agrémenter les trajets avec un peu de poésie.</p>",
        bio: "<p>Sophie Calle est célèbre pour son art narratif où elle mêle sa vie intime à celle des autres, jouant sur la frontière entre voyeurisme et poésie.</p>"
    },
    "jean_jaures": {
        name: "Jean Jaurès", badge: "CORRESPONDANCE A",
        artist: "Felice Varini", meta: "Locarno (Suisse), 1952",
        title: "Anamorphose",
        desc: "<p>Œuvre commune aux deux lignes : des formes géométriques monumentales peintes sur l'architecture ne forment une figure cohérente que depuis un point de vue précis dans le couloir de correspondance.</p>",
        bio: "<p>L'artiste utilise l'architecture comme toile pour ses anamorphoses qui défient la perception de l'espace.</p>"
    },
    "francois_verdier": {
        name: "François Verdier", badge: "PRÉFECTURE",
        artist: "Patrick Corillon", meta: "Knokke (Belgique), 1959",
        title: "Le Mallandier",
        desc: "<p>L'œuvre représente un arbre, le « Mallandier », dont l'histoire imaginaire est gravée sur le tronc. Dans les branchages apparaissent des fragments d'arbres et des noms de champs de bataille.</p>",
        bio: "<p>Patrick Corillon est un conteur plasticien qui crée des univers fictionnels s'insérant dans la réalité des espaces publics.</p>"
    },
    "carmes": {
        name: "Carmes", badge: "CENTRE HISTORIQUE",
        artist: "Jean-Paul Marcheschi", meta: "Bastia (Corse), 1951",
        title: "La Voie Lactée",
        desc: "<p>Un canal sombre au plafond évoque un fleuve, une carte marine ou un ciel nocturne. C'est littéralement une « Voie Lactée », une écriture de lumière inspirée par le poème « La nuit obscure » de Jean de la Croix.</p>",
        bio: "<p>Marcheschi peint avec le feu, la suie et la cire, créant des œuvres sombres et mystiques.</p>"
    },
    "palais_de_justice": {
        name: "Palais de Justice", badge: "TRAMWAY",
        artist: "Le Groupe Irwin", meta: "Collectif slovène (1983)",
        title: "Liberté, Égalité, Fraternité",
        desc: "<p>L'œuvre est formée de quatre tapis où sont disposées des enseignes lumineuses associant les principes de la République au nom de la station. Les tapis issus de quatre cultures différentes suggèrent le sol, le domicile et le mouvement.</p>",
        bio: "<p>Le groupe Irwin (NSK) est un collectif d'avant-garde connu pour son utilisation ironique des symboles politiques et totalitaires.</p>"
    },
    "st_michel": {
        name: "St Michel - M. Langer", badge: "STATION",
        artist: "Michel Verjux", meta: "Chalon-sur-Saône, 1956",
        title: "Lumière projetée",
        desc: "<p>Quatre demi-cônes de lumière sont projetés dans un cône de matière construite. Trois faisceaux frappent les puits de lumière, le quatrième trace un cercle parfait au sol.</p>",
        bio: "<p>Michel Verjux ne sculpte pas la matière mais l'espace, en utilisant uniquement des projecteurs de théâtre ou de diapositives.</p>"
    },
    "empalot": {
        name: "Empalot", badge: "STATION",
        artist: "Daniel Dezeuze", meta: "Alès (Gard), 1942",
        title: "Échelle ADN",
        desc: "<p>Dans le vide central de la station sont installées six échelles de fibres optiques aux couleurs changeantes. Le titre fait allusion au code génétique, évoquant l'identité unique du genre humain dans une atmosphère de gaieté.</p>",
        bio: "<p>Membre fondateur du groupe Supports/Surfaces, Dezeuze déconstruit la peinture pour en révéler l'armature et le vide.</p>"
    },
    "st_agne": {
        name: "St Agne SNCF", badge: "GARE",
        artist: "Nicolas Hérubel", meta: "Rouen (Seine-Maritime), 1959",
        title: "Un seul ticket pour un même manège",
        desc: "<p>Un immense cerf-volant semble flotter dans l'espace de dilatation de la station, proposant une échappée imaginaire aux voyageurs.</p>",
        bio: "<p>Nicolas Hérubel crée des sculptures qui détournent des objets familiers pour leur donner une dimension poétique ou absurde.</p>"
    },
    "saouzelong": {
        name: "Saouzelong", badge: "STATION",
        artist: "Monique Frydman", meta: "Nages (Tarn), 1943",
        title: "Sans titre",
        desc: "<p>Sur un vitrail rétroéclairé, l'artiste joue sur la transparence. Des empreintes de cordes traitées au jaune d'argent forment des entrelacs évoquant des saules, rappelant l'étymologie du nom de la station.</p>",
        bio: "<p>Monique Frydman est une peintre abstraite qui travaille la couleur par imprégnation et frottage sur de grandes toiles ou papiers.</p>"
    },
    "rangueil": {
        name: "Rangueil", badge: "STATION",
        artist: "C. Caillol & J. Bartolani", meta: "Marseille / Haïfa",
        title: "Vent capricieux",
        desc: "<p>Des images de sacs en plastique aux couleurs vives sont comme transportés et plaqués sur la façade par un vent capricieux. Deux sculptures de jardiniers habitent le jardin de bambous en contrebas.</p>",
        bio: "<p>Duo d'artistes utilisant des matériaux pauvres et colorés pour créer des installations dynamiques pleines d'humour.</p>"
    },
    "fac_pharmacie": {
        name: "Faculté de Pharmacie", badge: "UNIVERSITÉ",
        artist: "Didier Mencoboni", meta: "Guingamp, 1959",
        title: "Sans titre",
        desc: "<p>L'artiste investit la verticalité d'une paroi pour y installer un jeu de boules de verre colorées et de perforations. Bousculant les repères, il laisse à penser que le sol est devenu mur.</p>",
        bio: "<p>Didier Mencoboni explore la couleur et la série à travers des dispositifs picturaux qui envahissent l'espace.</p>"
    },
    "universite_paul_sabatier": {
        name: "Université Paul Sabatier", badge: "UNIVERSITÉ",
        artist: "Roman Opalka", meta: "Abbeville (1931-2011)",
        title: "1965 / 1 - ∞",
        desc: "<p>Dans cette œuvre lumineuse, l'artiste réunit la pyramide des nombres et la ligne énigmatique d'une existence. C'est une réflexion vertigineuse sur le temps qui passe et l'infini.</p>",
        bio: "<p>Roman Opalka a consacré sa vie entière à peindre la suite des nombres de 1 à l'infini, une œuvre conceptuelle radicale sur le temps.</p>"
    },
    "ramonville": {
        name: "Ramonville", badge: "TERMINUS SUD",
        artist: "Jean-Pierre Bertrand", meta: "Paris (1937-2015)",
        title: "Code couleur",
        desc: "<p>Par un jeu consistant à associer chaque lettre du nom de la station à une valeur numérique, les baies du fronton colorées accueillent différents espaces dont les dimensions correspondent à cette transcription.</p>",
        bio: "<p>Jean-Pierre Bertrand travaillait sur les systèmes de correspondance entre nombres, couleurs et matériaux organiques.</p>"
    }
};

// ── Init select ──
const select = document.getElementById('stationSelect');
for (const key in stationsLigneB) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = stationsLigneB[key].name;
    select.appendChild(opt);
}

document.getElementById('backButtonB').addEventListener('click', e => {
    if (window.history.length > 1) { e.preventDefault(); window.history.back(); }
});

// ── Helpers ──
async function fetchText(path) {
    try { const r = await fetch(path); return r.ok ? await r.text() : null; }
    catch { return null; }
}
function parseTextFile(raw) {
    if (!raw) return null;
    const lines = raw.trim().split('\n');
    return { heading: lines[0].trim(), body: lines.slice(1).join('\n').trim() };
}

// ── Load station ──
async function loadStation(key) {
    const data = stationsLigneB[key];
    if (!data) return;

    // Background
    const bgLayer = document.getElementById('bg-layer');
    progressiveBg(bgLayer, `media/${key}/background_thumb.jpg`, `media/${key}/background.png`);

    // Header color
    const header = document.querySelector('header');
    if (key === 'jean_jaures') {
        header.style.background = 'linear-gradient(90deg, #d2232a, #ffcb04)';
    } else {
        header.style.background = '#ffcb04';
    }

    // Header logo
    const logo = document.getElementById('headerLogo');
    logo.src = `media/${key}/logo.svg`;
    logo.onerror = () => { logo.style.display = 'none'; };
    logo.onload  = () => { logo.style.display = ''; };

    // Card 1 — thumbnail shows instantly, progressive JPEG loads underneath
    const mainImg = document.getElementById('mainImage');
    const mainFrame = mainImg.closest('.media-frame');
    mainFrame.classList.add('frame-loading');
    mainImg.classList.add('img-loading');
    mainImg.onload = function onThumb() {
        mainImg.onload = null; mainImg.onerror = null;
        mainImg.src = `media/${key}/main.jpg`;
        mainImg.onload = () => { mainImg.classList.remove('img-loading'); mainFrame.classList.remove('frame-loading'); };
        mainImg.onerror = () => { mainImg.classList.remove('img-loading'); mainFrame.classList.remove('frame-loading'); mainImg.parentElement.innerHTML = '<div class="placeholder">PHOTO</div>'; };
    };
    mainImg.onerror = function onThumbFail() {
        mainImg.onload = null; mainImg.onerror = null;
        mainImg.classList.remove('img-loading');
        mainImg.src = `media/${key}/main.jpg`;
        mainImg.onload = () => mainFrame.classList.remove('frame-loading');
        mainImg.onerror = () => { mainFrame.classList.remove('frame-loading'); mainImg.parentElement.innerHTML = '<div class="placeholder">PHOTO</div>'; };
    };
    mainImg.src = `media/${key}/main_thumb.jpg`;
    document.getElementById('positionBadge').textContent = data.badge;

    const oeuvreFile = key === 'jean_jaures' ? `media/${key}/oeuvre_b.txt` : `media/${key}/oeuvre.txt`;
    const oeuvre = parseTextFile(await fetchText(oeuvreFile));
    document.getElementById('titreOeuvre').textContent = oeuvre ? oeuvre.heading : data.title;
    document.getElementById('descOeuvre').innerHTML    = oeuvre ? `<p>${oeuvre.body.replace(/\n/g, '<br>')}</p>` : data.desc;

    // Card 2
    document.getElementById('metaArtiste').textContent = data.meta;
    const artistFile = key === 'jean_jaures' ? `media/${key}/artist_b.txt` : `media/${key}/artist.txt`;
    const artist = parseTextFile(await fetchText(artistFile));
    document.getElementById('nomArtiste').textContent = artist ? artist.heading : data.artist;
    document.getElementById('bioArtiste').innerHTML   = artist ? `<p>${artist.body.replace(/\n/g, '<br>')}</p>` : data.bio;
    document.getElementById('bioArtiste').innerHTML    = data.bio;

    // Extra media
    await buildExtras(key);

    // Animate
    const main = document.getElementById('mainContent');
    main.style.opacity = '0';
    main.style.transform = 'translateY(12px)';
    requestAnimationFrame(() => {
        main.style.transition = 'opacity 0.45s ease, transform 0.45s ease';
        main.style.opacity = '1';
        main.style.transform = 'translateY(0)';
    });
}

async function checkFile(path) {
    try { const r = await fetch(path, { method: 'HEAD' }); return r.ok; }
    catch { return false; }
}

function makeMediaEl(path) {
    const isVideo = /\.(mp4|webm|ogg)$/i.test(path);
    if (isVideo) {
        return `<video src="${path}" controls style="width:100%;height:100%;object-fit:cover;display:block;"></video>`;
    }
    return `<img src="${path}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
}

async function buildExtras(stationId) {
    const extras = [];
    for (let i = 1; i <= 8; i++) {
        let found = null;
        for (const ext of ['jpg', 'jpeg', 'png', 'mp4', 'webm']) {
            const p = `media/${stationId}/${i}.${ext}`;
            if (await checkFile(p)) { found = p; break; }
        }
        if (!found) break;
        extras.push(found);
    }

    const wrapper  = document.getElementById('firstMediaWrapper');
    const firstEl  = document.getElementById('firstMedia');
    const inner    = document.getElementById('artisteInner');
    const extraDiv = document.getElementById('extraMedia');

    if (extras.length > 0) {
        firstEl.innerHTML = makeMediaEl(extras[0]);
        wrapper.style.display = '';
        inner.className = 'grid-2';
        const firstImg = firstEl.querySelector('img');
        if (firstImg) {
            wrapper.classList.add('frame-loading');
            if (firstImg.complete) {
                wrapper.classList.remove('frame-loading');
            } else {
                firstImg.onload = () => wrapper.classList.remove('frame-loading');
                firstImg.onerror = () => wrapper.classList.remove('frame-loading');
            }
        }
    } else {
        wrapper.style.display = 'none';
        inner.className = 'grid-1';
    }

    extraDiv.innerHTML = '';
    for (let i = 1; i < extras.length; i++) {
        const card = document.createElement('div');
        card.className = 'section-card';
        const frame = document.createElement('div');
        frame.className = 'media-frame full-frame frame-loading';
        frame.innerHTML = makeMediaEl(extras[i]);
        const img = frame.querySelector('img');
        if (img) {
            if (img.complete) { frame.classList.remove('frame-loading'); }
            else {
                img.onload = () => frame.classList.remove('frame-loading');
                img.onerror = () => frame.classList.remove('frame-loading');
            }
        }
        card.appendChild(frame);
        extraDiv.appendChild(card);
    }
}

// ── Progressive loading ──
function progressiveBg(bgLayer, thumbSrc, fullSrc) {
    bgLayer.classList.add('bg-loading');
    const thumb = new Image();
    thumb.onload = () => {
        bgLayer.style.backgroundImage = `url('${thumbSrc}')`;
        const full = new Image();
        full.onload = () => { bgLayer.style.backgroundImage = `url('${fullSrc}')`; bgLayer.classList.remove('bg-loading'); };
        full.onerror = () => bgLayer.classList.remove('bg-loading');
        full.src = fullSrc;
    };
    thumb.onerror = () => {
        bgLayer.style.backgroundImage = `url('${fullSrc}')`;
        bgLayer.classList.remove('bg-loading');
    };
    thumb.src = thumbSrc;
}

// ── Light/dark toggle ──
function toggleMode() {
    const next = !document.body.classList.contains('light-mode');
    document.body.classList.toggle('light-mode', next);
    localStorage.setItem('theme', next ? 'light' : 'dark');
}

// Init: localStorage wins, then fall back to device preference
(function () {
    const saved = localStorage.getItem('theme');
    if (saved === 'light') {
        document.body.classList.add('light-mode');
    } else if (!saved && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.body.classList.add('light-mode');
    }
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
        if (!localStorage.getItem('theme')) {
            document.body.classList.toggle('light-mode', e.matches);
        }
    });
}());

// ── Mobile toggle: float above footer when reached ──
(function () {
    if (window.innerWidth > 768) return;
    const toggle = document.getElementById('modeSlider');
    const footer = document.querySelector('footer');
    if (!toggle || !footer) return;
    const GAP = 12;
    function update() {
        const footerTop = footer.getBoundingClientRect().top;
        if (footerTop < window.innerHeight - 24) {
            toggle.style.position = 'absolute';
            toggle.style.top = (footerTop + window.scrollY - toggle.offsetHeight - GAP) + 'px';
            toggle.style.bottom = '';
        } else {
            toggle.style.position = 'fixed';
            toggle.style.bottom = '24px';
            toggle.style.top = '';
        }
    }
    window.addEventListener('scroll', update, { passive: true });
    update();
}());

// ── Boot ──
const urlParams    = new URLSearchParams(window.location.search);
const stationParam = urlParams.get('station');
const initial      = stationParam && stationsLigneB[stationParam] ? stationParam : 'borderouge';
select.value = initial;
loadStation(initial);
</script>
