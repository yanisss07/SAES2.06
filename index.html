<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quai des Arts</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="./styles/intro.css">
    <style>
        html, body { height: 100%; overflow: hidden; }

        .accueil-stage {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            text-align: center;
            padding: 24px;
        }

        .accueil-logo {
            width: 96px;
            height: 96px;
            object-fit: contain;
            margin-bottom: 32px;
            opacity: 0.9;
            filter: drop-shadow(0 0 24px rgba(255, 59, 106, 0.4));
        }

        .accueil-title {
            margin: 0 0 12px;
            font-size: clamp(2.4rem, 6vw, 4rem);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 30%, #97a0c5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        body.light-mode .accueil-title {
            background: linear-gradient(135deg, #111 30%, #555);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .accueil-subtitle {
            margin: 0 0 48px;
            font-size: 1.05rem;
            color: var(--color-muted);
            font-weight: 300;
            letter-spacing: 0.04em;
            max-width: 380px;
        }

        .accueil-skip {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--color-muted);
            opacity: 0.6;
            text-decoration: none;
            letter-spacing: 0.04em;
            transition: opacity 0.2s;
        }

        .accueil-skip:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="page-bg"></div>

    <div id="theme-toggle" class="theme-bubble" role="button" aria-label="Basculer le thème">
        <span class="tb-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
        <div class="tb-track"><div class="tb-knob"></div></div>
        <span class="tb-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/></svg>
        </span>
    </div>

    <div class="accueil-stage">
        <img src="./logo.png" alt="Logo Quai des Arts" class="accueil-logo anim-in">
        <h1 class="accueil-title anim-in anim-in-delay-1">Quai des Arts</h1>
        <p class="accueil-subtitle anim-in anim-in-delay-2">Un voyage à travers l'art caché du métro toulousain.</p>
        <a href="./villes.html" class="btn-primary anim-in anim-in-delay-3">Commencer</a>
        <a href="./carte.html" class="accueil-skip anim-in anim-in-delay-4">Accéder directement à la carte →</a>
    </div>

    <script>
        // ── Theme init ──
        const mq = window.matchMedia("(prefers-color-scheme: light)");
        const saved = localStorage.getItem("theme");
        let isLight = saved ? saved === "light" : mq.matches;
        if (isLight) document.body.classList.add("light-mode");

        const toggle = document.getElementById("theme-toggle");
        const apply = (light, save = true) => {
            isLight = light;
            document.body.classList.toggle("light-mode", light);
            if (save) localStorage.setItem("theme", light ? "light" : "dark");
        };
        toggle.addEventListener("click", () => apply(!isLight));
        mq.addEventListener("change", (e) => { if (!localStorage.getItem("theme")) apply(e.matches, false); });

        // ── Skip intro for returning users ──
        if (sessionStorage.getItem("atlasVisited") === "1") {
            document.querySelector(".accueil-skip").style.cssText = "font-size:0.85rem;color:var(--color-accent-a);opacity:0.85;text-decoration:none;letter-spacing:0.04em;transition:opacity 0.2s;margin-top:20px;";
        }
    </script>
</body>
</html>
