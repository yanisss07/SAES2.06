<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorer · Quai des Arts</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="./styles/intro.css">
    <style>
        html, body { height: 100%; overflow: hidden; }

        .enter-stage {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            text-align: center;
            padding: 24px;
        }

        .enter-line {
            font-size: clamp(1.1rem, 2.8vw, 1.6rem);
            font-weight: 300;
            color: var(--color-muted);
            letter-spacing: 0.06em;
            max-width: 560px;
            line-height: 1.5;
            margin: 0;
        }

        .enter-line em {
            font-style: normal;
            color: var(--color-text);
            font-weight: 500;
        }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 18px 44px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--color-accent-a), var(--color-accent-b));
            border: none;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 6px 36px rgba(255, 59, 106, 0.4);
            transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-enter:hover {
            opacity: 0.92;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 48px rgba(255, 59, 106, 0.55);
        }

        .enter-hint {
            font-size: 0.78rem;
            color: var(--color-muted);
            opacity: 0.45;
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body>
    <div class="page-bg"></div>

    <div id="theme-toggle" class="theme-bubble" role="button" aria-label="Basculer le thème">
        <span class="tb-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
        <div class="tb-track"><div class="tb-knob"></div></div>
        <span class="tb-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/></svg>
        </span>
    </div>

    <div class="enter-stage">
        <p class="enter-line anim-in">
            La carte que <em>Tisséo</em> n'a pas su garder.
        </p>
        <a href="./carte.html" class="btn-enter anim-in anim-in-delay-2">
            Explorer les œuvres
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
        <span class="enter-hint anim-in anim-in-delay-3">38 artistes · 2 lignes · 28 km</span>
    </div>

    <script>
        // ── Theme init ──
        const mq = window.matchMedia("(prefers-color-scheme: light)");
        const saved = localStorage.getItem("theme");
        let isLight = saved ? saved === "light" : mq.matches;
        if (isLight) document.body.classList.add("light-mode");
        const toggle = document.getElementById("theme-toggle");
        const apply = (light, save = true) => {
            isLight = light;
            document.body.classList.toggle("light-mode", light);
            if (save) localStorage.setItem("theme", light ? "light" : "dark");
        };
        toggle.addEventListener("click", () => apply(!isLight));
        mq.addEventListener("change", (e) => { if (!localStorage.getItem("theme")) apply(e.matches, false); });
    </script>
</body>
</html>
